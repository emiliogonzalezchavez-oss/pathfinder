name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          build-config: RelWithDebInfo

  package:
    name: Package and publish
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # Fixed download link for "Actualizar Pathfinder.bat": releases/latest/download/tobi437a.pathfinder.geode
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest ${{ steps.build.outputs.build-output }}/*.geode -R "${{ github.repository }}" --title "Pathfinder (ultima version)" --notes "Build automatico de ${{ github.sha }}" --latest
